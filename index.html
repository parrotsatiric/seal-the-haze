<style>
/* Layout: one arcade screen centred on the page, scaled in whole pixel steps, with a slim control strip under it. */
:root {
  --bg: #12101c;
  --panel: #1d1b2e;
  --ink: #f1ead7;
  --dim: #9a93b3;
  --accent: #f2b134;
  --line: #3a3650;
  --font-ui: "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box;
  overflow-x: hidden;
}
#shell {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--bg);
}
canvas#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
  box-shadow: 0 0 0 3px var(--line), 0 14px 40px rgba(0, 0, 0, 0.55);
  touch-action: none;
  max-width: 100%;
  filter: saturate(1.2) contrast(1.03);
}
#bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 16px;
  font-size: 9px;
  line-height: 1.6;
  color: var(--dim);
  text-align: center;
}
#bar p { margin: 0; min-width: 0; }
#bar button {
  font: inherit;
  font-size: 9px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 6px 10px;
  cursor: pointer;
}
#bar button:hover { border-color: var(--accent); }
#bar button:focus-visible, #touch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#touch {
  display: grid;
  grid-template-columns: auto;
  justify-content: center;
  width: 100%;
  max-width: 480px;
  gap: 12px;
  user-select: none;
  -webkit-user-select: none;
}
#touch[hidden] { display: none; }
#touch .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 4px; }
#touch button {
  font-family: var(--font-ui);
  font-size: 16px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  touch-action: none;
}
#touch button:active, #touch button.on { background: var(--accent); color: #14121f; }
#touch .up { grid-column: 2; grid-row: 1; }
#touch .left { grid-column: 1; grid-row: 2; }
#touch .down { grid-column: 2; grid-row: 2; }
#touch .right { grid-column: 3; grid-row: 2; }
#touch .act { width: 108px; height: 108px; border-radius: 50%; font-size: 12px; align-self: center; }
@media (prefers-reduced-motion: reduce) { canvas#game { transition: none; } }
</style>

<main id="shell">
  <canvas id="game" width="384" height="240" tabindex="0" aria-label="Seal the Haze game screen"></canvas>
  <div id="touch" hidden>
    <div class="pad">
      <button class="up" data-key="up" aria-label="Move up">&#9650;</button>
      <button class="left" data-key="left" aria-label="Move left">&#9664;</button>
      <button class="down" data-key="down" aria-label="Move down">&#9660;</button>
      <button class="right" data-key="right" aria-label="Move right">&#9654;</button>
    </div>
  </div>
  <div id="bar">
    <p id="hint">ARROWS + ENTER, OR CLICK / TAP.</p>
    <button id="mute" type="button">SOUND: ON</button>
    <button id="fs" type="button">FULLSCREEN</button>
  </div>

/* =====================================================================
   LEVEL BUILDING
   Turns the data above into a tile grid the game can collide against.
   kind: 0 floor, 1 wall, 2 window, 3 furniture
   ===================================================================== */
function buildLevel(def) {
  const W = def.W, H = def.H;
  const L = Object.assign({}, def);
  const kind = new Uint8Array(W * H), solid = new Uint8Array(W * H);
  const at = (x, y) => y * W + x;
  const put = (x, y, k, s) => { if (x >= 0 && y >= 0 && x < W && y < H) { kind[at(x, y)] = k; solid[at(x, y)] = s; } };
  for (let x = 0; x < W; x++) { put(x, 0, 1, 1); put(x, H - 1, 1, 1); }
  for (let y = 0; y < H; y++) { put(0, y, 1, 1); put(W - 1, y, 1, 1); }
  for (const [x1, y1, x2, y2] of def.walls) for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) put(x, y, 1, 1);
  for (const [dx, dy, dw, dh] of def.doors) for (let y = dy; y < dy + dh; y++) for (let x = dx; x < dx + dw; x++) put(x, y, 0, 0);

  // rooms
  const roomGrid = new Int8Array(W * H).fill(-1);
  L.rooms = def.rooms.map((r, i) => {
    for (const [x, y, w, h] of r.rects) for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) roomGrid[at(xx, yy)] = i;
    return { id: r.id, name: r.name, col: r.col, rects: r.rects, h: 0, links: [] };
  });
  const roomIndex = id => L.rooms.findIndex(r => r.id === id);
  // links come from doors: look at the tiles on both sides
  for (const [dx, dy, dw, dh] of def.doors) {
    const a = dw === 1 ? at(dx - 1, dy) : at(dx, dy - 1);
    const b = dw === 1 ? at(dx + 1, dy) : at(dx, dy + 1);
    const ra = roomGrid[a], rb = roomGrid[b];
    if (ra >= 0 && rb >= 0 && ra !== rb) {
      if (!L.rooms[ra].links.includes(rb)) L.rooms[ra].links.push(rb);
      if (!L.rooms[rb].links.includes(ra)) L.rooms[rb].links.push(ra);
    }
  }
  // door tiles take the room of a neighbour
  const roomFull = Int8Array.from(roomGrid);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (roomFull[at(x, y)] === -1 && !solid[at(x, y)]) {
      for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const r = roomGrid[at(x + ax, y + ay)];
        if (r >= 0) { roomFull[at(x, y)] = r; break; }
      }
    }
  }
  L.roomFull = roomFull;

  // windows
  L.windows = def.windows.map((w, i) => {
    const tiles = [];
    for (let k = 0; k < w.l; k++) {
      const tx = w.s === 'T' || w.s === 'B' ? w.p + k : (w.s === 'L' ? 0 : W - 1);
      const ty = w.s === 'L' || w.s === 'R' ? w.p + k : (w.s === 'T' ? 0 : H - 1);
      tiles.push([tx, ty]); put(tx, ty, 2, 1);
    }
    const horiz = w.s === 'T' || w.s === 'B';
    const rect = { x: tiles[0][0] * T, y: tiles[0][1] * T, w: horiz ? w.l * T : T, h: horiz ? T : w.l * T };
    return { i, name: w.n, room: roomIndex(w.r), side: w.s, len: w.l, ht: w.h, area: w.l * w.h, rect, tiles,
      cmW: w.l * 30, cmH: w.h === 1 ? 100 : 210, sealed: false, life: 0, maxLife: 1, progress: 0, flash: 0, failFlash: 0 };
  });

  // furniture
  L.furn = def.furn;
  for (const f of def.furn) if (f.t !== 'rug') for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) put(x, y, 3, 1);
  L.kind = kind; L.solid = solid;
  L.spawnPx = { x: def.spawn[0] * T + 4, y: def.spawn[1] * T + 4 };

  // reachability from spawn (also used by the self test)
  const seen = new Uint8Array(W * H), q = [at(def.spawn[0], def.spawn[1])];
  seen[q[0]] = 1;
  while (q.length) {
    const c = q.pop(), cx = c % W, cy = (c / W) | 0;
    for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + ax, ny = cy + ay;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const n = at(nx, ny);
      if (!solid[n] && !seen[n]) { seen[n] = 1; q.push(n); }
    }
  }
  L.reach = seen;
  L.free = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (seen[at(x, y)] && roomGrid[at(x, y)] >= 0) L.free.push([x, y]);
  L.checks = [];
  for (const w of L.windows) {
    const inward = w.tiles.map(([tx, ty]) => w.side === 'T' ? [tx, ty + 1] : w.side === 'B' ? [tx, ty - 1] : w.side === 'L' ? [tx + 1, ty] : [tx - 1, ty]);
    w.access = inward.filter(([x, y]) => seen[at(x, y)]);
    if (!w.access.length) L.checks.push('window ' + w.name + ' unreachable');
  }
  for (const r of L.rooms) {
    // every room must be reachable
    const ok = r.rects.some(([x, y, w, h]) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (seen[at(xx, yy)]) return true; return false; });
    if (!ok) L.checks.push('room ' + r.name + ' unreachable');
  }
  L.ox = Math.floor((VW - W * T) / 2);
  L.oy = HUD_H + 2 + Math.floor((BAR_Y - HUD_H - 4 - H * T) / 2);
  L.layer = renderStatic(L);
  L.mini = renderMini(L);
  return L;
}

function drawFurn(c, f) {
  const x = f.x * T, y = f.y * T, w = f.w * T, h = f.h * T;
  const rect = (rx, ry, rw, rh, col) => { c.fillStyle = col; c.fillRect(x + rx, y + ry, rw, rh); };
  switch (f.t) {
    case 'rug': rect(0, 0, w, h, f.c); rect(2, 2, w - 4, h - 4, mix(f.c, '#ffffff', 0.18)); rect(4, 4, w - 8, h - 8, f.c); break;
    case 'bed': {
      rect(0, 0, w, h, '#5a3d27'); rect(1, 1, w - 2, h - 2, '#e8e1cf');
      const pw = Math.floor((w - 6) / 2);
      rect(2, 2, pw, 5, '#fff'); rect(w - 2 - pw, 2, pw, 5, '#fff');
      rect(1, 9, w - 2, h - 10, f.c); rect(1, 9, w - 2, 1, mix(f.c, '#ffffff', 0.35));
      rect(1, h - 4, w - 2, 1, mix(f.c, '#000000', 0.25)); break;
    }
    case 'wardrobe':
      rect(0, 0, w, h, '#4a3220'); rect(1, 1, w - 2, h - 2, '#8a5f3a'); rect(1, 1, w - 2, 2, '#a87a50');
      for (let i = 1; i < f.w; i++) rect(i * T - 1, 3, 1, h - 4, '#4a3220');
      for (let i = 0; i < f.w; i++) { rect(i * T + 2, Math.floor(h / 2), 1, 2, '#e0c070'); rect(i * T + 5, Math.floor(h / 2), 1, 2, '#e0c070'); } break;
    case 'desk':
      rect(0, 0, w, h, '#6b4a2f'); rect(1, 1, w - 2, h - 2, '#a67c52');
      rect(3, 3, 7, 5, '#2b2b3a'); rect(4, 4, 5, 3, '#6fd0ff'); rect(w - 7, h - 7, 5, 5, '#3b3b52'); break;
    case 'sofa': {
      const horiz = f.w > f.h;
      rect(0, 0, w, h, '#2f4660'); rect(1, 1, w - 2, h - 2, '#4f6d8f');
      if (f.back === 'R') { rect(w - 4, 0, 4, h, '#2f4660'); rect(w - 3, 1, 2, h - 2, '#3d5878'); }
      if (f.back === 'B') { rect(0, h - 4, w, 4, '#2f4660'); rect(1, h - 3, w - 2, 2, '#3d5878'); }
      for (let i = 1; i < (horiz ? f.w : f.h); i++) { if (horiz) rect(i * T - 1, 1, 1, h - 5, '#3d5878'); else rect(1, i * T - 1, w - 5, 1, '#3d5878'); }
      break;
    }
    case 'tv':
      rect(0, 0, w, h, '#2a1e18'); if (f.w === 1) rect(5, 3, 2, h - 6, '#0f0f18'); else rect(3, 5, w - 6, 2, '#0f0f18');
      if (f.w === 1) rect(5, 4, 1, 3, '#4aa3ff'); else rect(4, 5, 3, 1, '#4aa3ff'); break;
    case 'table':
      rect(0, 0, w, h, '#7a5a35'); rect(1, 1, w - 2, h - 2, '#b08a5a'); rect(2, 2, w - 4, 1, '#c9a574');
      if (f.w >= 3 && f.h >= 2) { rect(Math.floor(w / 2) - 1, Math.floor(h / 2) - 1, 3, 3, '#f1ead7'); }
      break;
    case 'counter':
      rect(0, 0, w, h, '#7d868c'); rect(1, 1, w - 2, h - 2, '#c3c9ce'); rect(3, 3, 8, h - 6, '#8a949c');
      rect(w - 12, 4, 4, 4, '#3a3a44'); rect(w - 7, 4, 4, 4, '#3a3a44'); break;
    case 'fridge':
      rect(0, 0, w, h, '#9aa6ad'); rect(1, 1, w - 2, h - 2, '#e3eaee'); rect(w - 3, 2, 1, Math.min(4, h - 3), '#7b878e'); break;
    case 'plant':
      rect(2, 4, 4, 4, '#9b5b3a'); rect(1, 0, 6, 5, '#3f9a4a'); rect(2, 1, 4, 3, '#5fc063'); rect(3, 2, 1, 1, '#9be08e'); break;
    case 'shelf':
      rect(0, 0, w, h, '#4a3220'); rect(1, 1, w - 2, h - 2, '#7a5636');
      for (let i = 0; i < f.w * 2; i++) rect(2 + i * 4, 2, 3, 4, ['#c85a5a', '#4aa3ff', '#f2d43a', '#5fc063'][i % 4]); break;
  }
}

function renderStatic(L) {
  const c = document.createElement('canvas'); c.width = L.W * T; c.height = L.H * T;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const at = (x, y) => y * L.W + x;
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) {
    const k = L.kind[at(x, y)];
    if (k === 1 || k === 2) continue;
    const r = L.rooms[L.roomFull[at(x, y)]] || L.rooms[0];
    g.fillStyle = r.col[(x + y) & 1]; g.fillRect(x * T, y * T, T, T);
    if (L.kind[at(x, y - 1)] === 1 || L.kind[at(x, y - 1)] === 2) { g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x * T, y * T, T, 2); }
  }
  for (const f of L.furn) if (f.t === 'rug') drawFurn(g, f);
  for (const f of L.furn) if (f.t !== 'rug') drawFurn(g, f);
  // walls
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) {
    if (L.kind[at(x, y)] !== 1) continue;
    g.fillStyle = '#4a4668'; g.fillRect(x * T, y * T, T, T);
    const up = y > 0 ? L.kind[at(x, y - 1)] : 1, down = y < L.H - 1 ? L.kind[at(x, y + 1)] : 1;
    if (up !== 1) { g.fillStyle = '#7a74a0'; g.fillRect(x * T, y * T, T, 1); }
    if (down !== 1) { g.fillStyle = '#2a2740'; g.fillRect(x * T, y * T + T - 2, T, 2); }
    g.fillStyle = '#3a3656'; g.fillRect(x * T + 3, y * T + 3, 2, 2);
  }
  return c;
}

function renderMini(L, s = 2) {
  const c = document.createElement('canvas'); c.width = L.W * s; c.height = L.H * s;
  const g = c.getContext('2d');
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) {
    const k = L.kind[y * L.W + x];
    g.fillStyle = k === 1 ? '#2a2740' : k === 2 ? '#4aa3ff' : (L.rooms[L.roomFull[y * L.W + x]] || L.rooms[0]).col[0];
    g.fillRect(x * s, y * s, s, s);
  }
  return c;
}

const sky = (() => {
  const c = document.createElement('canvas'); c.width = VW; c.height = VH;

  let seed = 7; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  let x = -6;
  while (x < VW) {
    const w = 26 + Math.floor(rnd() * 26), h = 50 + Math.floor(rnd() * 70);
    const base = ['#3b4a63', '#46556f', '#34415a'][Math.floor(rnd() * 3)];
    g.fillStyle = base; g.fillRect(x, VH - h, w, h);
    g.fillStyle = mix(base, '#ffffff', 0.12); g.fillRect(x, VH - h, w, 3);
    for (let yy = VH - h + 8; yy < VH - 6; yy += 7) for (let xx = x + 3; xx < x + w - 3; xx += 5) {
      g.fillStyle = rnd() > 0.7 ? '#e6c46a' : mix(base, '#000000', 0.25); g.fillRect(xx, yy, 3, 4);
    }
    x += w + 2 + Math.floor(rnd() * 4);
  }
  return c;
})();

function updatePlay(dt) {

  } else if (P.surge > 0) {

  } else {
    P.surgeT -= dt;
    if (P.surgeT <= 0) {
      if (P.t < par.duration - 18) { P.warn = 4 + tm.warn; P.sirenT = 0; addMsg('HAZE SURGE IN ' + Math.round(P.warn) + ' SECONDS!', '#ff6b5a'); }

    }
  }

  // players: stand still next to a window and the frame unfolds by itself

    const nw = nearestWindow(p, 10 + p.m.reach);

    }

    w.holders = holders.length;
    if (holders.length) {
      w.progress += dt * sealRate(w, holders);
      if (P.tickT <= 0) { SFX.tick(w.progress); P.tickT = 0.09; }
      if (w.progress >= 1) {

      }

      } else {

        SFX.gust(); P.shake = 0.3; addMsg('WIND GUST! ' + w.name + ' WEAKENED', '#f2b134');
        for (let i = 0; i < 18; i++) P.parts.push({ x: -4, y: rand(HUD_H, BAR_Y), vx: rand(120, 220), vy: rand(-10, 10), life: 1.4, max: 1.4, col: '#e8d9a8', sz: 1 });

      p.hp -= dps * dt; P.stats.exposed[p.i] += dt; p.hurt = Math.min(1, p.hurt + dt * 2);
      p.coughT -= dt;
      if (dps > 0.9 && p.coughT <= 0) { SFX.cough(); p.coughT = 1.1; burst(L.ox + p.x, L.oy + p.y - 12, '#c9a227', 4, 20); }
    } else p.hurt = Math.max(0, p.hurt - dt * 2);
    if (p.m.regen && hz < 0.1 && p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + p.m.regen * dt);
    if (p.mask > 0) p.mask -= dt;
  }
  const fh = L.rooms[P.fam.room].h, fdps = Math.max(0, fh - 0.08) * DMG_RATE * FAM_MULT * (1 - tm.fam);
  if (fdps > 0) { P.fam.hp -= fdps * dt; P.fam.hurt = Math.min(1, P.fam.hurt + dt * 2); } else P.fam.hurt = Math.max(0, P.fam.hurt - dt * 2);

  // masks on the floor
  P.maskTimer -= dt;
  if (P.maskTimer <= 0) {
    if (P.masks.length < 2) {
      for (let tries = 0; tries < 30; tries++) {
        const [tx, ty] = L.free[irand(0, L.free.length - 1)];
        const px = tx * T + 4, py = ty * T + 4;
        if (P.pl.every(p => Math.hypot(px - p.x, py - p.y) > 40)) { P.masks.push({ x: px, y: py, t: 0 }); break; }
      }
    }
    P.maskTimer = 18 / (1 + tm.masks);
  }
  for (let i = P.masks.length - 1; i >= 0; i--) {
    const m = P.masks[i]; m.t += dt;
    const taker = P.pl.find(p => Math.hypot(m.x - p.x, m.y - p.y) < 7);
    if (taker) {
      const dur = Math.round(12 + tm.masks * 8);
      P.masks.splice(i, 1); taker.mask = dur; SFX.pick();
      addMsg((P.np === 2 ? 'P' + (taker.i + 1) + ' ' : '') + 'MASK ON! ' + dur + ' SECONDS OF SAFER AIR', '#9bf0b0');
      burst(L.ox + m.x, L.oy + m.y, '#ffffff', 10, 40);
    }
  }

  // call-outs: mark the nearest window so your partner knows where to run
  if (P.np === 2) for (const p of P.pl) if (pingEdge[p.i]) {
    pingEdge[p.i] = false;
    const w = nearestWindow(p, 40);
    let gx = p.x, gy = p.y;
    if (w) { const a = w.access[Math.floor(w.access.length / 2)] || [Math.floor(p.x / T), Math.floor(p.y / T)]; gx = a[0] * T + 4; gy = a[1] * T + 4; }
    P.pings = P.pings.filter(g => g.p !== p.i);
    P.pings.push({ x: gx, y: gy, t: 4, p: p.i });
    SFX.ping(); addMsg('P' + (p.i + 1) + ' CALLS FOR HELP' + (w ? ' AT ' + shortName(w.name) : ''), PCOL[p.i]);
  }
  for (const g of P.pings) g.t -= dt;
  P.pings = P.pings.filter(g => g.t > 0);

  // haze wisps drift in through open windows
  for (const w of L.windows) if (!w.sealed && Math.random() < psiN * 0.35) {
    const r = w.rect, horiz = w.side === 'T' || w.side === 'B';
    const px = L.ox + r.x + (horiz ? Math.random() * r.w : r.w / 2), py = L.oy + r.y + (horiz ? r.h / 2 : Math.random() * r.h);
    const vx = w.side === 'L' ? 18 : w.side === 'R' ? -18 : rand(-4, 4), vy = w.side === 'T' ? 18 : w.side === 'B' ? -18 : rand(-4, 4);
    P.parts.push({ x: px, y: py, vx, vy, life: 1.2, max: 1.2, col: '#d9b24a', sz: 2, soft: true });
  }
  for (let i = P.parts.length - 1; i >= 0; i--) {
    const p = P.parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) P.parts.splice(i, 1);
  }
  for (const m of P.msgs) m.age += dt;
  P.msgs = P.msgs.filter(m => m.age < 3);
  P.shake = Math.max(0, P.shake - dt);

  // music: a small bass loop that speeds up with the PSI
  P.musicT -= dt;
  if (P.musicT <= 0) {
    const notes = [110, 110, 165, 110, 131, 131, 196, 131];
    tone(notes[P.musicStep % 8], 0.14, 'triangle', 0.05);
    if (psiN > 0.7 && P.musicStep % 2) tone(notes[P.musicStep % 8] * 4, 0.05, 'square', 0.015);
    P.musicStep++; P.musicT = 0.26 - psiN * 0.08;
  }
  if (P.t > par.duration - 12 && !P.windMsg) { P.windMsg = true; addMsg('WINDS ARE SHIFTING. HOLD ON!', '#9bf0b0'); }

  // second wind: a revive charge turns a knockout into a second chance
  for (const p of P.pl) if (p.hp <= 0) {
    const sw = G.run.sw[p.i];
    if (sw.length) {
      p.hp = Math.max(1, p.maxHp * sw.shift()); p.inv = 2.5; p.mask = Math.max(p.mask, 6); P.stats.winds++;
      SFX.revive(); addMsg((P.np === 2 ? 'P' + (p.i + 1) + ' ' : '') + 'SECOND WIND!', '#e36ab0'); burst(L.ox + p.x, L.oy + p.y - 8, '#ff9ad0', 16, 50);
    }
  }
  const dead = P.pl.find(p => p.hp <= 0);
  if (dead) { dead.hp = 0; finishRound(false, 'P' + (dead.i + 1)); return; }
  if (P.fam.hp <= 0) { P.fam.hp = 0; finishRound(false, 'FAM'); return; }
  if (P.t >= par.duration) finishRound(true);
}

/* =====================================================================
   DRAWING: PLAY
   ===================================================================== */
function drawChar(c, ch, x, y, dir, frame, s = 1, mask = false) {
  const R2 = (rx, ry, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x + rx * s), Math.round(y + ry * s), w * s, h * s); };
  c.globalAlpha = 0.28; R2(-4, -1, 8, 3, '#000'); c.globalAlpha = 1;
  const lift = frame === 1 ? 1 : 0, lift2 = frame === 2 ? 1 : 0;
  const side = dir === 'l' || dir === 'r';
  if (side) {
    const off = frame === 0 ? 0 : (frame === 1 ? -1 : 1);
    R2(-2 + off, -3, 2, 3, ch.pants); R2(0 - off, -3, 2, 3, ch.pants); R2(-2 + off, -1, 2, 1, ch.shoe); R2(0 - off, -1, 2, 1, ch.shoe);
  } else {
    R2(-3, -3 - lift, 2, 3 + lift, ch.pants); R2(1, -3 - lift2, 2, 3 + lift2, ch.pants);
    R2(-3, -1 - lift, 2, 1, ch.shoe); R2(1, -1 - lift2, 2, 1, ch.shoe);
  }
  // body
  if (side) { R2(-3, -9, 6, 6, ch.shirt); R2(dir === 'r' ? -1 : -2, -8, 3, 4, ch.shirtD); }
  else { R2(-4, -9, 8, 6, ch.shirt); R2(-5, -8, 1, 4, ch.shirtD); R2(4, -8, 1, 4, ch.shirtD); R2(-5, -4, 1, 1, ch.skin); R2(4, -4, 1, 1, ch.skin); }
  if (ch.id === 'raj') { R2(side ? -3 : -4, -5, side ? 6 : 8, 1, '#8a5a2a'); R2(dir === 'r' ? 1 : (dir === 'l' ? -2 : 3), -5, 1, 2, '#bbb'); }
  // head
  R2(-3, -14, 6, 5, ch.skin);
  if (dir === 'd') {
    R2(-3, -15, 6, 2, ch.hair); R2(-3, -14, 1, 2, ch.hair); R2(2, -14, 1, 2, ch.hair);
    if (ch.id === 'tan') { R2(-3, -12, 2, 1, '#2a2a34'); R2(1, -12, 2, 1, '#2a2a34'); R2(-1, -12, 2, 1, '#2a2a34'); }
    else { R2(-2, -12, 1, 1, '#1a1a1a'); R2(1, -12, 1, 1, '#1a1a1a'); }
    if (ch.id === 'raj') R2(-2, -10, 4, 1, '#1a1a1a');
  } else if (dir === 'u') {
    R2(-3, -15, 6, 5, ch.hair);
  } else {
    const back = dir === 'r' ? -3 : 0;
    R2(-3, -15, 6, 2, ch.hair); R2(back, -14, 3, 4, ch.hair);
    R2(dir === 'r' ? 1 : -2, -12, 1, 1, '#1a1a1a');
    if (ch.id === 'tan') R2(dir === 'r' ? 1 : -3, -12, 2, 1, '#2a2a34');
  }
  if (ch.id === 'aisha') {
    if (dir === 'd') R2(3, -13, 1, 4, ch.hair); else if (dir === 'u') R2(-1, -10, 2, 5, ch.hair);
    else R2(dir === 'r' ? -5 : 3, -13, 2, 5, ch.hair);
  }
  if (ch.id === 'tan') R2(-2, -18, 4, 3, ch.hair);
  if (ch.id === 'raj') { R2(-4, -16, 8, 3, '#d4503a'); if (dir === 'd') R2(-4, -13, 8, 1, '#a83a28'); else if (dir === 'r') R2(3, -13, 3, 1, '#a83a28'); else if (dir === 'l') R2(-6, -13, 3, 1, '#a83a28'); }
  if (mask && dir !== 'u') { R2(-2, -10, 4, 2, '#f4f1e8'); R2(-3, -11, 1, 1, '#f4f1e8'); R2(2, -11, 1, 1, '#f4f1e8'); }
}

function drawWindow(w, ox, oy, t, psiN) {
  const r = w.rect, x = ox + r.x, y = oy + r.y;
  const horiz = w.side === 'T' || w.side === 'B';
  const glass = mix('#8fd3f0', '#c9a85a', clamp(psiN, 0, 1));
  if (w.sealed) {
    ctx.fillStyle = '#cfd8e3'; ctx.fillRect(x, y, r.w, r.h);
    ctx.fillStyle = '#667487';
    if (horiz) { ctx.fillRect(x, y, r.w, 1); ctx.fillRect(x, y + r.h - 1, r.w, 1); } else { ctx.fillRect(x, y, 1, r.h); ctx.fillRect(x + r.w - 1, y, 1, r.h); }
    ctx.fillStyle = mix(glass, '#ffffff', 0.55);
    ctx.fillRect(x + 2, y + 2, r.w - 4, r.h - 4);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let k = 4; k < (horiz ? r.w : r.h) - 2; k += 8) { if (horiz) ctx.fillRect(x + k, y + 2, 2, r.h - 4); else ctx.fillRect(x + 2, y + k, r.w - 4, 2); }
    const ratio = w.life / w.maxLife, low = ratio < 0.25;
    const led = low ? (Math.floor(t * 8) % 2 ? '#ff5a4a' : '#5a1a14') : (ratio < 0.5 ? '#f2d43a' : '#5be37d');
    ctx.fillStyle = led; ctx.fillRect(x + 1, y + 1, 2, 2);
    if (w.crack) {
      ctx.fillStyle = '#2a3340';
      const n = horiz ? r.w : r.h;
      for (let i = 2; i < n - 2; i += 3) { const o = 2 + ((i / 3) & 1) * 2; if (horiz) ctx.fillRect(x + i, y + o, 2, 1); else ctx.fillRect(x + o, y + i, 1, 2); }
    }
    if (w.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + clamp(w.flash * 1.6, 0, 0.8) + ')'; ctx.fillRect(x, y, r.w, r.h); }
  } else {
    ctx.fillStyle = '#6f7a96'; ctx.fillRect(x, y, r.w, r.h);
    ctx.fillStyle = glass; ctx.fillRect(x + 1, y + 1, r.w - 2, r.h - 2);
    ctx.fillStyle = '#4d5675';
    for (let k = 0; k <= (horiz ? r.w : r.h); k += 16) { if (horiz) ctx.fillRect(x + k, y, 1, r.h); else ctx.fillRect(x, y + k, r.w, 1); }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    if (horiz) ctx.fillRect(x + 2, y + 2, r.w - 4, 1); else ctx.fillRect(x + 2, y + 2, 1, r.h - 4);
    if (w.failFlash > 0 && Math.floor(t * 12) % 2) { ctx.fillStyle = 'rgba(255,60,40,0.7)'; ctx.fillRect(x, y, r.w, r.h); }
  }
  // status strip just inside the room
  let bx, by, bw, bh;
  if (w.side === 'T') { bx = x; by = y + T; bw = r.w; bh = 2; }
  else if (w.side === 'B') { bx = x; by = y - 2; bw = r.w; bh = 2; }
  else if (w.side === 'L') { bx = x + T; by = y; bw = 2; bh = r.h; }
  else { bx = x - 2; by = y; bw = 2; bh = r.h; }
  ctx.fillStyle = '#14121f'; ctx.fillRect(bx, by, bw, bh);
  if (w.sealed) {
    const ratio = clamp(w.life / w.maxLife, 0, 1);
    ctx.fillStyle = w.crack ? '#d06aff' : ratio > 0.5 ? '#5be37d' : ratio > 0.25 ? '#f2d43a' : (Math.floor(t * 8) % 2 ? '#ff5a4a' : '#8a2a22');
    if (horiz) ctx.fillRect(bx, by, Math.round(bw * ratio), bh); else { const hh = Math.round(bh * ratio); ctx.fillRect(bx, by + bh - hh, bw, hh); }
  } else {
    ctx.fillStyle = '#e0453a';
    const o = Math.floor(t * 12) % 4, n = horiz ? bw : bh;
    for (let k = -o; k < n; k += 4) { const a = Math.max(0, k), b = Math.min(n, k + 2); if (b > a) { if (horiz) ctx.fillRect(bx + a, by, b - a, bh); else ctx.fillRect(bx, by + a, bw, b - a); } }
  }
  if (w.progress > 0) {
    ctx.fillStyle = '#14121f';
    let px, py, pw, ph;
    if (w.side === 'T') { px = x; py = y + T + 2; pw = r.w; ph = 3; }
    else if (w.side === 'B') { px = x; py = y - 5; pw = r.w; ph = 3; }
    else if (w.side === 'L') { px = x + T + 2; py = y; pw = 3; ph = r.h; }
    else { px = x - 5; py = y; pw = 3; ph = r.h; }
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = '#4fe3ff';
    if (horiz) ctx.fillRect(px, py, Math.round(pw * w.progress), ph); else { const hh = Math.round(ph * w.progress); ctx.fillRect(px, py + ph - hh, pw, hh); }
  }
}

function drawSleeper(ox, oy, t) {
  // the family member asleep in their bed: Ah Gong, a baby, or the cat
  const b = P.L.family.bed, x = ox + b[0] * T, y = oy + b[1] * T, k = P.fam.kind;

// one small square per boon: patron colour inside, rarity colour as the border
function pipRow(list, x, y, align) {
  let sx = align === 'r' ? x - list.length * 8 + 1 : x;
  for (const o of list) {
    const b = BOON_BY[o.id], R = RARITY[o.rar], pat = PATRONS[patOf(b)];
    ctx.fillStyle = R.c; ctx.fillRect(sx, y, 7, 7);
    ctx.fillStyle = pat.c; ctx.fillRect(sx + 1, y + 1, 5, 5);
    if (b.duo) { ctx.fillStyle = PATRONS[b.pats[1]].c; ctx.fillRect(sx + 3, y + 1, 3, 5); }
    sx += 8;
  }
}

function drawInset(w, hold) {
  // a close-up of the window while the frame unfolds: width first, then height
  const p = clamp(w.progress, 0, 1);
  const pw = 100, ph = 76, a = hold[0];
  const px = Math.round(clamp(P.L.ox + a.x - pw / 2, 4, VW - pw - 4));
  let py = P.L.oy + a.y - 36 - ph; if (py < HUD_H + 4) py = P.L.oy + a.y + 10;
  py = Math.round(clamp(py, HUD_H + 4, BAR_Y - ph - 2));
  ctx.fillStyle = '#14121f'; ctx.fillRect(px - 1, py - 1, pw + 2, ph + 2);
  ctx.fillStyle = '#2a2740'; ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = hold.length === 2 ? '#5be37d' : (P.np === 2 ? PCOL[a.i] : '#f2b134'); ctx.fillRect(px, py, pw, 9);
  text('SEAL FRAME ' + BRAND, px + 4, py + 1, '#14121f');
  const openW = Math.min(64, w.len * 8), openH = w.ht === 2 ? 30 : 18;
  const cx = px + pw / 2, cy = py + 9 + 22;
  ctx.fillStyle = '#3d6b88'; ctx.fillRect(Math.round(cx - openW / 2), Math.round(cy - openH / 2), openW, openH);
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(Math.round(cx - openW / 2) + 2, Math.round(cy - openH / 2) + 2, 3, openH - 4);
  const p1 = clamp(p / 0.5, 0, 1), p2 = clamp((p - 0.5) / 0.5, 0, 1);
  const fw = Math.round(lerp(8, openW, p1)), fh = Math.round(lerp(8, openH, p2));
  const fx = Math.round(cx - fw / 2), fy = Math.round(cy - fh / 2);
  ctx.fillStyle = '#cfd8e3'; ctx.fillRect(fx - 1, fy - 1, fw + 2, fh + 2);
  ctx.fillStyle = '#4f86a6'; ctx.fillRect(fx + 1, fy + 1, fw - 2, fh - 2);
  ctx.fillStyle = '#667487';
  for (let k = 2; k < fw - 1; k += 6) ctx.fillRect(fx + k, fy - 1, 1, 2);
  for (let k = 2; k < fh - 1; k += 6) ctx.fillRect(fx - 1, fy + k, 2, 1);
  if (p < 1) {
    const f = Math.floor(G.t * 8) % 2;
    ctx.fillStyle = '#4fe3ff';
    if (p < 0.5) {
      for (let i = 0; i < 4; i++) { ctx.fillRect(fx - 3 - f - i, Math.round(cy) - i, 1, 1 + i * 2); ctx.fillRect(fx + fw + 2 + f + i, Math.round(cy) - i, 1, 1 + i * 2); }
    } else {
      for (let i = 0; i < 4; i++) { ctx.fillRect(Math.round(cx) - i, fy - 3 - f - i, 1 + i * 2, 1); ctx.fillRect(Math.round(cx) - i, fy + fh + 2 + f + i, 1 + i * 2, 1); }
    }
  }
  let label = p < 0.5 ? 'UNFOLDING WIDTH' : 'UNFOLDING HEIGHT', lc = '#f1ead7';
  if (P.np === 2 && w.area >= 10 && hold.length < 2) { label = 'NEED PARTNER!'; lc = Math.floor(G.t * 6) % 2 ? '#ff6b5a' : '#f1ead7'; }
  else if (hold.length === 2) { label = 'TEAM BONUS!'; lc = '#9bf0b0'; }
  const wc = Math.round(w.cmW * p1), hc = Math.round(w.cmH * p2);
  text(label, px + 4, py + ph - 24, lc);
  text('W ' + wc + '  H ' + hc + ' CM', px + 4, py + ph - 14, '#9a93b3');
  ctx.fillStyle = '#14121f'; ctx.fillRect(px + 4, py + ph - 4, pw - 8, 2);
  ctx.fillStyle = '#4fe3ff'; ctx.fillRect(px + 4, py + ph - 4, Math.round((pw - 8) * p), 2);
}

function drawHUD() {
  const L = P.L, par = P.par;
  ctx.fillStyle = '#1d1b2e'; ctx.fillRect(0, 0, VW, HUD_H);
  ctx.fillStyle = '#3a3650'; ctx.fillRect(0, HUD_H - 1, VW, 1);
  const flashOn = Math.floor(G.t * 10) % 2 === 0;
  const hpCol = r => r > 0.5 ? '#5be37d' : r > 0.25 ? '#f2d43a' : '#e0453a';
  const bar = (x, y, w, ratio, col, flash) => {
    ctx.fillStyle = '#14121f'; ctx.fillRect(x - 1, y - 1, w + 2, 8);
    ctx.fillStyle = flash ? '#ffffff' : col; ctx.fillRect(x, y, Math.round(w * clamp(ratio, 0, 1)), 6);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; for (let k = 10; k < w; k += 10) ctx.fillRect(x + k, y, 1, 6);
  };
  P.pl.forEach((p, i) => {
    const r = clamp(p.hp / p.maxHp, 0, 1), left = i === 0;
    const label = P.np === 2 ? 'P' + (i + 1) + ' ' + p.ch.name : 'LUNGS';
    text(label, left ? 5 : 379, 3, P.np === 2 ? PCOL[i] : '#9a93b3', 1, left ? 'l' : 'r');
    bar(left ? 5 : 275, 13, 104, r, hpCol(r), p.hurt > 0.3 && flashOn);
    text(Math.ceil(r * 100) + '%', left ? 113 : 270, 13, '#f1ead7', 1, left ? 'l' : 'r');
    if (p.mask > 0) {
      const mx = left ? 5 + textW(label) + 8 : 379 - textW(label) - 26;
      ctx.fillStyle = '#f4f1e8'; ctx.fillRect(mx, 3, 8, 5); ctx.fillStyle = '#9a93b3'; ctx.fillRect(mx - 2, 4, 2, 1); ctx.fillRect(mx + 8, 4, 2, 1);
      text(Math.ceil(p.mask), mx + 12, 3, '#9bf0b0');
    }
  });
  if (P.np === 1) {
    text('CLEAR IN ' + fmtTime(par.duration - P.t), 379, 3, '#f1ead7', 1, 'r');
    ctx.fillStyle = '#14121f'; ctx.fillRect(274, 12, 106, 8);
    ctx.fillStyle = '#4aa3ff'; ctx.fillRect(275, 13, Math.round(104 * clamp(P.t / par.duration, 0, 1)), 6);
  }

function drawPlay() {
  const L = P.L, psiN = P.psi / 300, ox = L.ox, oy = L.oy, t = P.t;
  ctx.save();
  if (P.shake > 0) ctx.translate(Math.round(rand(-1.5, 1.5) * P.shake * 3), Math.round(rand(-1.5, 1.5) * P.shake * 3));
  drawBackdrop(psiN);
  ctx.drawImage(L.layer, ox, oy);
  drawSleeper(ox, oy, t);
  L.rooms.forEach(r => {
    const lv = Math.round(clamp(r.h, 0, 1) * 13);
    if (!lv) return;
    ctx.fillStyle = HAZE_ROOM[lv];
    for (const [x, y, w, h] of r.rects) ctx.fillRect(ox + x * T, oy + y * T, w * T, h * T);
  });
  for (const w of L.windows) drawWindow(w, ox, oy, t, psiN);
  for (const m of P.masks) {
    const bob = Math.round(Math.sin(m.t * 5) * 1.5);
    ctx.fillStyle = Math.floor(m.t * 4) % 2 ? '#ffffff' : '#bfe8ff';
    ctx.fillRect(ox + m.x - 3, oy + m.y - 2 + bob, 6, 4);
    ctx.fillStyle = '#9a93b3'; ctx.fillRect(ox + m.x - 5, oy + m.y - 1 + bob, 2, 1); ctx.fillRect(ox + m.x + 3, oy + m.y - 1 + bob, 2, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(ox + m.x - 3, oy + m.y + 3, 6, 1);
  }
  // players, back to front
  [...P.pl].sort((a, b) => a.y - b.y).forEach(p => {
    if (p.inv > 0 && Math.floor(G.t * 14) % 2) return;
    const frame = p.moving ? [0, 1, 0, 2][Math.floor(p.anim) % 4] : 0;
    const fx = Math.round(ox + p.x), fy = Math.round(oy + p.y + 3);
    drawChar(ctx, p.ch, fx, fy, p.dir, frame, 1, p.mask > 0);
    if (P.np === 2) {
      ctx.fillStyle = PCOL[p.i]; ctx.fillRect(fx - 2, fy - 24, 5, 1); ctx.fillRect(fx - 1, fy - 23, 3, 1); ctx.fillRect(fx, fy - 22, 1, 1);
      text(String(p.i + 1), fx, fy - 32, PCOL[p.i], 1, 'c', '#000');
    }
  });
  // call-outs
  for (const g of P.pings) {
    const bob = Math.round(Math.sin(P.t * 10) * 1.5), a = clamp(g.t, 0, 1);
    ctx.globalAlpha = a;
    const x = Math.round(ox + g.x), y = Math.round(oy + g.y - 6 + bob);
    ctx.fillStyle = '#000'; ctx.fillRect(x - 5, y - 15, 11, 12);
    ctx.fillStyle = PCOL[g.p]; ctx.fillRect(x - 4, y - 14, 9, 10);
    ctx.fillRect(x - 2, y - 3, 5, 1); ctx.fillRect(x - 1, y - 2, 3, 1); ctx.fillRect(x, y - 1, 1, 1);
    text('!', x, y - 13, '#14121f', 1, 'c');
    ctx.globalAlpha = 1;
  }
  for (const p of P.parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * (p.soft ? 0.6 : 1);
    ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = HAZE_AIR[Math.round(clamp(psiN, 0, 1) * 4)]; ctx.fillRect(0, HUD_H, VW, BAR_Y - HUD_H);
  if (P.surge > 0) { ctx.fillStyle = HAZE_ROOM[3]; ctx.fillRect(0, HUD_H, VW, BAR_Y - HUD_H); }
  const hurt = Math.max(...P.pl.map(p => p.hurt), P.fam.hurt);
  if (hurt > 0.3) { ctx.globalAlpha = (hurt - 0.3) * 0.5; ctx.fillStyle = DARK_DITH[8]; ctx.fillRect(0, HUD_H, VW, BAR_Y - HUD_H); ctx.globalAlpha = 1; }
  ctx.restore();

  drawHUD(); drawBottomBar();
  const groups = new Map();
  for (const p of P.pl) if (p.deploy) { if (!groups.has(p.deploy)) groups.set(p.deploy, []); groups.get(p.deploy).push(p); }
  groups.forEach((hold, w) => drawInset(w, hold));
  // alarm frame during the warning
  if (P.warn > 0 && Math.floor(G.t * 4) % 2) {
    ctx.fillStyle = '#ff3b2a';
    ctx.fillRect(0, HUD_H, VW, 2); ctx.fillRect(0, BAR_Y - 2, VW, 2); ctx.fillRect(0, HUD_H, 2, BAR_Y - HUD_H); ctx.fillRect(VW - 2, HUD_H, 2, BAR_Y - HUD_H);
  }

    const a = clamp(3 - m.age, 0, 1);

    const w = textW(m.t) + 10, x = Math.round(VW / 2 - w / 2), y = HUD_H + 4 + i * 12;

}

function keycap(x, y, label, col, down) {

  ctx.fillStyle = down ? mix(col, '#ffffff', 0.4) : col; ctx.fillRect(x, y + oy, 15, 13 - oy);

}
function arrowKey(x, y, dir, col, down) {
  keycap(x, y, '', col, down);
  const cx = x + 7, cy = y + 6 + (down ? 1 : 0);
  ctx.fillStyle = '#14121f';
  for (let i = 0; i < 4; i++) {
    if (dir === 'u') ctx.fillRect(cx - i, cy - 3 + i, 1 + 2 * i, 1);

    else if (dir === 'l') ctx.fillRect(cx - 3 + i, cy - i, 1, 1 + 2 * i);
    else ctx.fillRect(cx + 3 - i, cy - i, 1, 1 + 2 * i);
  }
}
function cluster(cx, y, kind, col, dn) {
  const k = kind === 'wasd' ? ['W', 'A', 'S', 'D'] : ['u', 'l', 'd', 'r'];
  const put = (x, yy, i) => kind === 'wasd' ? keycap(x, yy, k[i], col, dn[i]) : arrowKey(x, yy, k[i], col, dn[i]);
  put(cx - 7, y, 0); put(cx - 24, y + 17, 1); put(cx - 7, y + 17, 2); put(cx + 10, y + 17, 3);
}
// a looping picture: walk to the window, let go of the keys, the frame unfolds by itself
function drawDemo(x, y, w, h, ch) {
  const t = G.t % 5, prog = clamp((t - 1.8) / 2, 0, 1), done = t >= 3.8;
  ctx.fillStyle = '#14121f'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#8a7350'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#9a8460'; for (let k = 0; k < w; k += 16) ctx.fillRect(x + k, y + 20, 8, h - 20);
  ctx.fillStyle = '#4a4668'; ctx.fillRect(x, y, w, 20);
  ctx.fillStyle = '#2a2740'; ctx.fillRect(x, y + 19, w, 2);
  const wx = x + Math.round(w / 2) - 20, wy = y + 3;
  ctx.fillStyle = done ? '#cfd8e3' : '#6f7a96'; ctx.fillRect(wx, wy, 40, 13);
  ctx.fillStyle = done ? '#d4f1fa' : (t < 1.8 ? '#d9b24a' : '#8fd3f0'); ctx.fillRect(wx + 2, wy + 2, 36, 9);
  ctx.fillStyle = '#14121f'; ctx.fillRect(wx, y + 22, 40, 3);
  ctx.fillStyle = done ? '#5be37d' : '#4fe3ff'; ctx.fillRect(wx, y + 22, Math.round(40 * (done ? 1 : prog)), 3);
  if (t > 1.8 && !done) {                                    // the frame unfolding
    const fw = Math.round(lerp(10, 40, clamp(prog / 0.5, 0, 1))), fh = Math.round(lerp(4, 13, clamp((prog - 0.5) / 0.5, 0, 1)));
    ctx.fillStyle = '#4fe3ff';
    const fx = wx + 20 - Math.round(fw / 2), fy = wy + 6 - Math.round(fh / 2);
    ctx.fillRect(fx, fy, fw, 1); ctx.fillRect(fx, fy + fh, fw, 1); ctx.fillRect(fx, fy, 1, fh); ctx.fillRect(fx + fw - 1, fy, 1, fh);
  }
  const stand = y + 62, startY = y + h - 6;
  const fy = t < 1.8 ? lerp(startY, stand, t / 1.8) : stand;
  const frame = t < 1.8 ? [0, 1, 0, 2][Math.floor(t * 9) % 4] : 0;
  drawChar(ctx, ch, Math.round(x + w / 2), Math.round(fy), 'u', frame, 2, false);
  if (done && t < 4.4) { ctx.fillStyle = '#9bf0b0'; const bx = wx + 46, by = y + 6; ctx.fillRect(bx, by + 4, 2, 2); ctx.fillRect(bx + 2, by + 6, 2, 2); ctx.fillRect(bx + 4, by + 4, 2, 2); ctx.fillRect(bx + 6, by + 2, 2, 2); ctx.fillRect(bx + 8, by, 2, 2); }
}

/* =====================================================================
   MAIN UPDATE / RENDER
   ===================================================================== */
const confirmKey = () => pressed.has('ok') || pressed.has('act');
function update(dt) {
  G.t += dt;
  for (const s of specks) { s.x -= s.v * dt; if (s.x < -2) { s.x = VW + 2; s.y = Math.random() * VH; } }
  const left = pressed.has('left'), right = pressed.has('right'), up = pressed.has('up'), down = pressed.has('down');
  switch (G.state) {
    case 'title':
      if (left || up) { G.tsel = (G.tsel + 2) % 3; SFX.ui(); }
      if (right || down) { G.tsel = (G.tsel + 1) % 3; SFX.ui(); }
      if (pressed.has('d1')) titlePick(0); else if (pressed.has('d2')) titlePick(1);
      else if (confirmKey()) titlePick(G.tsel);
      break;
    case 'chars':
      if (left) { G.ch[G.pick] = (G.ch[G.pick] + 2) % 3; SFX.ui(); }
      if (right) { G.ch[G.pick] = (G.ch[G.pick] + 1) % 3; SFX.ui(); }
      if (confirmKey()) charsNext(); else if (pressed.has('esc')) charsBack();
      break;
    case 'levels':
      if (left) { G.lv = (G.lv + 2) % 3; SFX.ui(); }
      if (right) { G.lv = (G.lv + 1) % 3; SFX.ui(); }
      if (up) { G.heat = Math.min(3, G.heat + 1); SFX.ui(); }
      if (down) { G.heat = Math.max(0, G.heat - 1); SFX.ui(); }
      if (confirmKey()) { SFX.ok(); go('controls'); } else if (pressed.has('esc')) go('chars');
      break;
    case 'controls': if (confirmKey()) { SFX.ok(); startRun(); } else if (pressed.has('esc')) go('levels'); break;
    case 'boon':
      if (left) { G.pk.sel = (G.pk.sel + 2) % 3; SFX.ui(); }
      if (right) { G.pk.sel = (G.pk.sel + 1) % 3; SFX.ui(); }
      if (pressed.has('retry')) rerollCards();
      else if (confirmKey() && G.t > 0.25) pickCard(G.pk.sel);
      break;
    case 'door':
      if (left || right) { G.door.sel = 1 - G.door.sel; SFX.ui(); }
      if (confirmKey() && G.t > 0.25) takeDoor(G.door.sel);
      break;
    case 'clear': if (confirmKey() && G.t > 0.5) clearNext(); break;
    case 'shop':
      if (up) { G.shop = (G.shop + UPG.length - 1) % UPG.length; SFX.ui(); }
      if (down) { G.shop = (G.shop + 1) % UPG.length; SFX.ui(); }
      if (confirmKey()) buyUpgrade(G.shop); else if (pressed.has('esc')) go('title');
      break;
    case 'countdown': {
      P.countdown -= dt;
      const n = Math.ceil(P.countdown);
      if (n !== P.lastCount) { P.lastCount = n; if (P.countdown > 0.4) SFX.beep(); }
      if (P.countdown <= 0) { SFX.go(); go('play'); }
      break;
    }
    case 'play': updatePlay(dt); break;
    case 'pause':
      if (pressed.has('pause') || pressed.has('esc')) go('play');
      else if (pressed.has('retry')) startRun();
      break;
    case 'end':
      if (pressed.has('retry')) startRun(); else if (confirmKey() && G.t > 0.6) go('levels');
      break;
  }
  if (pressed.has('mute')) toggleMute();
  pressed.clear();
}

function render() {
  ui.cur = ui.next; ui.next = [];
  ctx.imageSmoothingEnabled = false;
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'chars': drawChars(); break;
    case 'levels': drawLevels(); break;
    case 'controls': drawControls(); break;
    case 'boon': drawBoon(); break;
    case 'door': drawDoor(); break;
    case 'clear': drawClear(); break;
    case 'shop': drawShop(); break;
    case 'countdown': drawCountdown(); break;
    case 'play': drawPlay(); break;
    case 'pause': drawPause(); break;
    case 'end': drawEnd(); break;
  }
  const hint = document.getElementById('hint');
  const playing = G.state === 'play' || G.state === 'countdown';
  const txt = playing ? 'PAUSE: P.  SOUND: M.' : 'ARROWS + ENTER, OR CLICK / TAP.';
  if (hint.textContent !== txt) hint.textContent = txt;
  cv.style.cursor = !playing && ui.cur.some(b => ui.mx >= b.x && ui.mx < b.x + b.w && ui.my >= b.y && ui.my < b.y + b.h) ? 'pointer' : 'default';
}

let last = performance.now(), acc = 0;
function frame(now) {
  let d = (now - last) / 1000; last = now;
  if (d > 0.25) d = 0.25;
  acc += d;
  let n = 0;
  while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  render();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
// menus use NAV names; during play each key belongs to a player
const NAV = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'act', KeyE: 'act', Enter: 'ok', Escape: 'esc', KeyP: 'pause', KeyM: 'mute', KeyR: 'retry', Digit1: 'd1', Digit2: 'd2' };
function mapPlay(code) {
  const two = G.np === 2;
  switch (code) {
    case 'KeyA': return [0, 'left']; case 'KeyD': return [0, 'right']; case 'KeyW': return [0, 'up']; case 'KeyS': return [0, 'down'];
    case 'KeyQ': return [0, 'ping'];
    case 'ArrowLeft': return [two ? 1 : 0, 'left']; case 'ArrowRight': return [two ? 1 : 0, 'right'];
    case 'ArrowUp': return [two ? 1 : 0, 'up']; case 'ArrowDown': return [two ? 1 : 0, 'down'];
    case 'Slash': case 'Period': return two ? [1, 'ping'] : null;
  }
  return null;
}
window.addEventListener('keydown', e => {
  const a = NAV[e.code], m = mapPlay(e.code);
  if (!a && !m) return;
  e.preventDefault();
  audioInit();
  if (a && !e.repeat) pressed.add(a);
  if (m) { if (m[1] === 'ping') { if (!e.repeat) pingEdge[m[0]] = true; } else inp[m[0]][m[1]] = true; }
});
window.addEventListener('keyup', e => { const m = mapPlay(e.code); if (m && m[1] !== 'ping') inp[m[0]][m[1]] = false; });
function clearInputs() { for (const k of inp) for (const a in k) k[a] = false; }
window.addEventListener('blur', () => { clearInputs(); if (G.state === 'play') go('pause'); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') go('pause'); });
function toPx(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * VW / r.width, (e.clientY - r.top) * VH / r.height]; }
cv.addEventListener('pointermove', e => { [ui.mx, ui.my] = toPx(e); });
cv.addEventListener('pointerleave', () => { ui.mx = -1; ui.my = -1; });
cv.addEventListener('pointerdown', e => {
  audioInit();
  const [x, y] = toPx(e); ui.mx = x; ui.my = y;
  if (G.state === 'play' || G.state === 'countdown') return;
  for (let i = ui.cur.length - 1; i >= 0; i--) {
    const b = ui.cur[i];
    if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) { b.fn(); break; }
  }
});
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.key;
  const on = e => { e.preventDefault(); audioInit(); inp[0][k] = true; if (G.state !== 'play') pressed.add(k === 'act' ? 'ok' : k); b.classList.add('on'); };
  const off = e => { e.preventDefault(); inp[0][k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
if (window.matchMedia && matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0) document.getElementById('touch').hidden = false;

function toggleMute() {
  muted = !muted;
  document.getElementById('mute').textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON');
}
document.getElementById('mute').addEventListener('click', () => { audioInit(); toggleMute(); });
document.getElementById('fs').addEventListener('click', () => {
  try { const s = document.getElementById('shell'); if (document.fullscreenElement) document.exitFullscreen(); else if (s.requestFullscreen) s.requestFullscreen().catch(() => {}); } catch (e) { /* optional */ }
});

/* ---------- scale the canvas in whole-pixel steps ---------- */
function fit() {
  const bar = document.getElementById('bar'), touch = document.getElementById('touch');
  const availW = document.documentElement.clientWidth - 32;
  const availH = window.innerHeight - bar.offsetHeight - (touch.hidden ? 0 : touch.offsetHeight + 12) - 48;
  let s = Math.min(availW / VW, availH / VH);
  s = s >= 2 ? Math.floor(s) : Math.max(0.5, s);
  cv.style.width = Math.floor(VW * s) + 'px'; cv.style.height = Math.floor(VH * s) + 'px';
}
window.addEventListener('resize', fit); document.addEventListener('fullscreenchange', fit);
